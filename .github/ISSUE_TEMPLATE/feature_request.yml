name: Feature request
description: Suggest something Peep or the peep command could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/ROADMAP.md](https://github.com/itspriddle/peep/blob/main/docs/ROADMAP.md)
        first: it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you imagine it working, in the app or on the command line.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or how other tools handle it.
