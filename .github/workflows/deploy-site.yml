name: Deploy site

# Builds Site/ and deploys it to the peep.now Worker. Run it by hand (Actions > Deploy site >
# Run workflow, pick a branch), or call it from the release workflow:
#
#   deploy-site:
#     uses: ./.github/workflows/deploy-site.yml
#     with:
#       ref: ${{ github.sha }}
#     secrets: inherit

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the calling workflow's ref)
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://peep.now
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: Site
          node-version: "24"
          cache: true
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
      - name: Deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
