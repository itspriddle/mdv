name: Deploy site

# Builds Site/ and deploys it to the peep.now Worker. Run it by hand (Actions > Deploy site >
# Run workflow, pick a branch); the release workflow calls it after publishing a release. The
# build copies the latest published release's signed appcast.xml into dist/ (Site/scripts), so
# every deploy serves the current appcast.
#
# The Cloudflare secrets are `site` environment secrets, read by the job below. A caller must
# still pass them by name (GitHub resolves the names in the called job's environment; "You can
# pass a secret by name even if it only exists in the environment", docs.github.com, Reuse
# workflows > Using inputs and secrets). `required: true` makes a caller that forgets fail:
#
#   site:
#     uses: ./.github/workflows/deploy-site.yml
#     secrets:
#       CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#       CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy (defaults to the calling workflow's ref)
        type: string
        required: false
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: site
      url: https://peep.now
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: Site
          node-version: "24"
          cache: true
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp run build
        env:
          # Only raises the GitHub API rate limit for the appcast lookup (Site/scripts/appcast.ts).
          GITHUB_TOKEN: ${{ github.token }}
      - name: Deploy
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
