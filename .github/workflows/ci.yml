name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install swiftlint
      - name: Lint
        run: make lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: Core tests
        run: make test-core
      - name: Build and test app
        run: make build test-app SIGN=0

  # Separate job: runs in parallel with `test`, and a UI flake doesn't hide core/app results.
  # Signs ad hoc (no Config/Local.xcconfig in CI); see `make test-ui`.
  ui-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: UI tests
        run: make test-ui
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AppUITests.xcresult
          path: build/AppUITests.xcresult
          retention-days: 7
