name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "Site/**"
      - ".github/workflows/deploy-site.yml"
  pull_request:
    paths-ignore:
      - "Site/**"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install swiftlint
      - name: Lint
        run: make lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: Core tests
        run: make test-core
        env:
          # Render wall-clock bounds are report-only here (Tests/PeepCoreTests/RenderTiming.swift).
          PEEP_TIMING_REPORT_ONLY: "1"
      - name: Build and test app
        run: make build test-app SIGN=0
        env:
          # Main-thread timing bounds are report-only here: shared runners are too starved for
          # them (AppTests/Support/MainThreadTiming.swift). They stay strict locally.
          TEST_RUNNER_PEEP_TIMING_REPORT_ONLY: "1"
      - name: Upload theme snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: theme-snapshots
          path: build/theme-snapshots
          if-no-files-found: ignore
          retention-days: 7

  # Separate job: runs in parallel with `test`, and a UI flake doesn't hide core/app results.
  # Signs ad hoc (no Config/Local.xcconfig in CI); see `make test-ui`.
  ui-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: UI tests
        run: make test-ui
        env:
          # Runs the window restoration UI test, which writes real saved state (fine on CI).
          TEST_RUNNER_PEEP_UI_TEST_RESTORATION: "1"
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AppUITests.xcresult
          path: build/AppUITests.xcresult
          retention-days: 7
