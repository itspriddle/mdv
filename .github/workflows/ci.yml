name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install swiftlint
      - name: Lint
        run: make lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: Core tests
        run: make test-core
        env:
          # Render wall-clock bounds are report-only here (Tests/MdvCoreTests/RenderTiming.swift).
          MDV_TIMING_REPORT_ONLY: "1"
      - name: Build and test app
        run: make build test-app SIGN=0
        env:
          # Main-thread timing bounds are report-only here: shared runners are too starved for
          # them (AppTests/Support/MainThreadTiming.swift). They stay strict locally.
          TEST_RUNNER_MDV_TIMING_REPORT_ONLY: "1"
      - name: Upload theme snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-snapshots
          path: build/theme-snapshots
          if-no-files-found: ignore
          retention-days: 7

  # Separate job: runs in parallel with `test`, and a UI flake doesn't hide core/app results.
  # Signs ad hoc (no Config/Local.xcconfig in CI); see `make test-ui`.
  ui-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen
      - name: UI tests
        run: make test-ui
        env:
          # Runs the window restoration UI test, which writes real saved state (fine on CI).
          TEST_RUNNER_MDV_UI_TEST_RESTORATION: "1"
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: AppUITests.xcresult
          path: build/AppUITests.xcresult
          retention-days: 7
