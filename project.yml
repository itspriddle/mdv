# XcodeGen spec. Run `make generate` to (re)create mdv.xcodeproj (gitignored).
name: mdv

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  mdv:
    path: .
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    from: 1.8.2

targets:
  mdv:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: mdv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Joshua Priddle. MIT License.
        # AppKit app lifecycle (App/main.swift); no main nib.
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          # Plain text opens from the Open panel and drag and drop, but mdv doesn't register as
          # a handler for it.
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.plain-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
                - mkdn
              public.mime-type:
                - text/markdown
    entitlements:
      path: App/mdv.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: mdv
        PRODUCT_MODULE_NAME: MdvApp
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: mdv
        product: MdvCore
      - target: mdv-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

  mdv-cli:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: mdv
        PRODUCT_MODULE_NAME: MdvCLI
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).cli
        SKIP_INSTALL: YES
    dependencies:
      - package: mdv
        product: MdvCore
      - package: swift-argument-parser
        product: ArgumentParser

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mdv.app/Contents/MacOS/mdv
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: mdv

schemes:
  mdv:
    build:
      targets:
        mdv: all
        mdv-cli: all
    test:
      targets:
        - AppTests
    run:
      config: Debug
    archive:
      config: Release
