# XcodeGen spec. Run `make generate` to (re)create mdv.xcodeproj (gitignored).
name: mdv

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  mdv:
    path: .

targets:
  MdvApp:
    type: application
    platform: macOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: mdv
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © 2026 Joshua Priddle. MIT License.
        # AppKit app lifecycle (App/main.swift); no main nib.
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            # Alternate: mdv offers to become the default instead of claiming it (#23, VISION).
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - $(PRODUCT_BUNDLE_IDENTIFIER_BASE).markdown
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
          # Plain text opens from the Open panel and drag and drop, but mdv doesn't register as
          # a handler for it.
          - CFBundleTypeName: Plain Text Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes:
              - public.plain-text
            NSDocumentClass: $(PRODUCT_MODULE_NAME).MarkdownDocument
        # macOS declares net.daringfireball.markdown (md, markdown); this import only stands in
        # where it doesn't. A system declaration always wins over an import, so extensions
        # added here would be ignored.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
              public.mime-type:
                - text/markdown
        # The other common Markdown extensions, which no system type declares. Exported: mdv
        # defines this type (under its own identifier) rather than borrowing another app's.
        # Keep the identifier in sync with MarkdownContentTypes.otherMarkdownExtensions.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - net.daringfireball.markdown
              - public.plain-text
            UTTypeReferenceURL: https://daringfireball.net/projects/markdown/
            UTTypeTagSpecification:
              public.filename-extension:
                - mdown
                - mkd
                - mkdn
    entitlements:
      path: App/mdv.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: mdv
        PRODUCT_MODULE_NAME: MdvApp
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: mdv
        product: MdvCore
      - target: mdv-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # Shell completions and the man page (#71), for the Homebrew cask and Install Command Line
    # Tool: Contents/Resources/completions/{_mdv,mdv.bash,mdv.fish} and
    # Contents/Resources/man/man1/mdv.1. Completions come from the embedded helper; the man page
    # from `make cli-docs` (which `make build` runs), required for Release.
    postBuildScripts:
      - name: Bundle shell completions and man page
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          helper="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/mdv"
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resources/completions"
          "$helper" --generate-completion-script zsh > "$resources/completions/_mdv"
          "$helper" --generate-completion-script bash > "$resources/completions/mdv.bash"
          "$helper" --generate-completion-script fish > "$resources/completions/mdv.fish"
          page="$SRCROOT/build/cli-docs/man/man1/mdv.1"
          if [ -f "$page" ]; then
            mkdir -p "$resources/man/man1"
            cp "$page" "$resources/man/man1/mdv.1"
          elif [ "$CONFIGURATION" = Release ]; then
            echo "error: $page is missing; run make cli-docs (make build runs it)"
            exit 1
          else
            echo "warning: no man page in this build; run make cli-docs"
          fi

  mdv-cli:
    type: tool
    platform: macOS
    # Only the entry point; the command is the package's MdvCLIKit (shared with `swift test`).
    sources:
      - path: CLI/Main
    settings:
      base:
        PRODUCT_NAME: mdv
        PRODUCT_MODULE_NAME: MdvCLI
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).cli
        SKIP_INSTALL: YES
    dependencies:
      - package: mdv
        product: MdvCLIKit

  AppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
        excludes:
          # Visual regression references (#39), read from the source tree, not the bundle.
          - Snapshots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/mdv.app/Contents/MacOS/mdv
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: MdvApp

  # XCTest UI tests (Swift Testing has no UI testing API). Run with `make test-ui`.
  AppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AppUITests
        excludes:
          - Fixtures
      # Copied as a folder; tests find files with `Fixtures.url(named:)`.
      - path: AppUITests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER_BASE).uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AppUITests/AppUITests.entitlements
    dependencies:
      - target: MdvApp

schemes:
  mdv:
    build:
      targets:
        MdvApp: all
        mdv-cli: all
    test:
      targets:
        - AppTests
        - AppUITests
    run:
      config: Debug
    archive:
      config: Release
