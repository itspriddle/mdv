included:
  - App
  - AppTests
  - AppUITests
  - CLI
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build
  # Vendored highlight.js, generated by scripts/vendor-highlightjs.sh.
  - Sources/MdvCore/Highlighting/HighlightJSSource.generated.swift

# swift-format owns layout; keep SwiftLint focused on correctness and style smells.
disabled_rules:
  - trailing_comma
  - opening_brace
  # TODOs are allowed only as `TODO(#N)`, pointing at the issue that resolves them.
  - todo

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_over_fileprivate
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_import
  - unused_declaration

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

# Exhaustive switches over AST node kinds are the clearest form for the parser and renderer.
cyclomatic_complexity:
  ignores_case_statements: true
