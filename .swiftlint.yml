included:
  - App
  - AppTests
  - CLI
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build

# swift-format owns layout; keep SwiftLint focused on correctness and style smells.
disabled_rules:
  - trailing_comma
  - opening_brace

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - overridden_super_call
  - private_over_fileprivate
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - vertical_whitespace_closing_braces

analyzer_rules:
  - unused_import
  - unused_declaration

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
