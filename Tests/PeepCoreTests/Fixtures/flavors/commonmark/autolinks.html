<h1 id="autolinks"><a class="anchor" aria-hidden="true" href="#autolinks"></a>Autolinks</h1>
<p>Extended autolinks: https://example.com/path, www.example.com, and user@example.com.</p>
<p>Angle-bracket autolinks are CommonMark: <a href="https://example.com">https://example.com</a> and <a href="mailto:user@example.com">mailto:user@example.com</a>.</p>
